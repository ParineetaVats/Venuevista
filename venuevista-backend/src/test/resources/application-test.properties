spring.datasource.url=jdbc:h2:mem:vv;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

venuevista.jwt.secret=test_jwt_secret_key_must_be_at_least_64_ascii_characters_long_for_hmac_sha_512_security!
venuevista.jwt.expiration-minutes=60
venuevista.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173
venuevista.timezone=Asia/Kolkata
venuevista.pricing.convenience-fee-per-ticket=40
