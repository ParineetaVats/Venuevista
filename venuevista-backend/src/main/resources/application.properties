server.port=8080
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/venuevista?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:YOUR_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

venuevista.jwt.secret=${JWT_SECRET:venuevista_dev_secret_key_must_be_at_least_64_ascii_characters_long_for_hmac_sha_512_security!}
venuevista.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:1440}
venuevista.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
venuevista.timezone=Asia/Kolkata
venuevista.pricing.convenience-fee-per-ticket=40
venuevista.pricing.tax-rate=0.05
venuevista.booking.max-seats=8
venuevista.hold.minutes=10
venuevista.seed.enabled=true
